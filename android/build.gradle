group 'com.flutterplayer.fplayer'
version '1.3.0'

def fplayerCoreVersionFile = file('fplayercore.version')
def fplayerCoreVersion = fplayerCoreVersionFile.exists()
        ? fplayerCoreVersionFile.text.trim()
        : (project.findProperty('fplayerCoreVersion') ?: '1.0.4')
def fplayerLocalRepo = uri("${projectDir}/local-repo")

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = fplayerLocalRepo }
    }
}

repositories {
    maven { url = fplayerLocalRepo }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.flutterplayer.fplayer'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 28
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    implementation "io.github.flutterplayer:fplayercore:${fplayerCoreVersion}"
}
